name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release name (e.g. v1.0.5 or v1.2-rc1)"
        required: true
      prerelease:
        description: "Is this a prerelease?"
        required: true
        type: boolean
      custom_message:
        description: "Optional pre-changelog message"
        required: false

permissions:
  contents: write

env:
  TAG_NAME: JS Engine - ${{ github.event.inputs.tag_name }} Release

jobs:
  ensure-tag:
    name: Create Tag (if needed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch all tags
        run: git fetch --tags

      - name: Set tag name
        id: tagger
        run: echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git tag ${{ github.event.inputs.tag_name }} || echo "Tag already exists"
          git push origin ${{ github.event.inputs.tag_name }} || echo "Tag already pushed"

      - name: Prepare pre-changelog message
        id: pre_changelog_message
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing a pre-changelog message..."

          BODY=""

          if [ -n "${{ github.event.inputs.custom_message }}" ]; then
            BODY="${{ github.event.inputs.custom_message }}\n${BODY}"
          fi

          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo -e "Final pre-changelog message:\n\n$BODY"

  build:
    name: Build Artifacts
    needs: ensure-tag
    uses: ./.github/workflows/main.yml
    with:
      buildFlags: officialBuild

  release-linux:
    name: Release linuxBuild
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linuxBuild
          path: build

      - name: Compress build
        run: |
          sudo apt-get install -y p7zip-full
          7z a -tzip linuxBuild.zip -w ./build/.

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: linuxBuild.zip
          asset_name: FNF-JS-Engine-linux.zip
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true

  release-windows:
    name: Release windowsBuild
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windowsBuild
          path: build

      - name: Compress build
        run: |
          sudo apt-get install -y p7zip-full
          7z a -tzip windowsBuild.zip -w ./build/.

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: windowsBuild.zip
          asset_name: FNF-JS-Engine-windows.zip
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true

  release-mac:
    name: Release macBuild
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macBuild-intel
          path: build-intel

      - name: Compress Intel build
        run: |
          sudo apt-get install -y p7zip-full
          7z a -tzip macBuild-intel.zip -w ./build-intel/.

      - name: Download Mac ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: macBuild-arm
          path: build-arm

      - name: Compress ARM build
        run: |
          7z a -tzip macBuild-arm.zip -w ./build-arm/.

      - name: Upload macBuild-intel
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: macBuild-intel.zip
          asset_name: FNF-JS-Engine-macOS-Intel.zip
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true

      - name: Upload macBuild-arm
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: macBuild-arm.zip
          asset_name: FNF-JS-Engine-macOS-ARM.zip
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true

  # ==========================================
  # NEW MOBILE & WEB RELEASE JOBS
  # ==========================================

  release-android:
    name: Release androidBuild
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
          path: build

      - name: Find and Package APK
        run: |
          sudo apt-get install -y p7zip-full
          # If artifact is a folder containing the APK, locate it or zip it up
          if [ -f ./build/*.apk ]; then
            cp ./build/*.apk ./FNF-JS-Engine-Android.apk
          else
            7z a -tzip FNF-JS-Engine-android.zip -w ./build/.
          fi

      - name: Upload Android Release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: ${{ hashFiles('FNF-JS-Engine-Android.apk') != '' && 'FNF-JS-Engine-Android.apk' || 'FNF-JS-Engine-android.zip' }}
          asset_name: ${{ hashFiles('FNF-JS-Engine-Android.apk') != '' && 'FNF-JS-Engine-Android.apk' || 'FNF-JS-Engine-android.zip' }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true

  release-ios:
    name: Release iosBuild
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: iosBuild
          path: build

      - name: Package iOS Build
        run: |
          sudo apt-get install -y p7zip-full
          if [ -f ./build/*.ipa ]; then
            cp ./build/*.ipa ./FNF-JS-Engine-iOS.ipa
          else
            7z a -tzip FNF-JS-Engine-iOS.zip -w ./build/.
          fi

      - name: Upload iOS Release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: ${{ hashFiles('FNF-JS-Engine-iOS.ipa') != '' && 'FNF-JS-Engine-iOS.ipa' || 'FNF-JS-Engine-iOS.zip' }}
          asset_name: ${{ hashFiles('FNF-JS-Engine-iOS.ipa') != '' && 'FNF-JS-Engine-iOS.ipa' || 'FNF-JS-Engine-iOS.zip' }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true

  release-html:
    name: Release html5Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download HTML5 artifact
        uses: actions/download-artifact@v4
        with:
          name: html5Build
          path: build

      - name: Compress HTML5 web build
        run: |
          sudo apt-get install -y p7zip-full
          7z a -tzip html5Build.zip -w ./build/.

      - name: Upload HTML5 Release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag_name }}
          file: html5Build.zip
          asset_name: FNF-JS-Engine-html5.zip
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          overwrite: true