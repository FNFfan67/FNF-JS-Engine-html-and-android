# This is a basic workflow to help you get started with Actions

name: Build


# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# For release builds
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main[span_2](start_span)[span_2](end_span)

      - uses: krdlab/setup-haxe@master[span_3](start_span)[span_3](end_span)
        with:
          haxe-version: 4.3.7[span_4](start_span)[span_4](end_span)
      - name: Restore Previous Cache
        id: cache-build-linux-restore
        uses: actions/cache/restore@main[span_5](start_span)[span_5](end_span)
        with:
          path: |
            .haxelib/
            build/release/linux/haxe/
            build/release/linux/obj/
          key: cache-linux-build[span_6](start_span)[span_6](end_span)
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get update -qq
          sudo apt-get install libvlc-dev -qq
          sudo apt-get install libvlccore-dev -qq
          sudo apt-get install libgtk-3-dev build-essential -qq
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install --force
      - name: Compile hxcpp
        run: |
          cd .haxelib/hxcpp/git/tools/run
          haxe compile.hxml
          cd ..
          cd ./hxcpp
          haxe compile.hxml
          cd ../../../../..
      - name: Compile
        run: |
          rm -f assets/preload/gameRenders/renderlol.bat
          haxelib run lime build linux -D ${{ inputs.buildFlags || 'commit' }}[span_7](start_span)[span_7](end_span)
      - name: Clear Previous Cache
        uses: actions/github-script@main[span_8](start_span)[span_8](end_span)
        with:
          script: |
            try {
            	const caches = await github.rest.actions.getActionsCacheList({
            		owner: context.repo.owner,
            		repo: context.repo.repo,
            	})
            	if (typeof caches.data.actions_caches != null && caches.data.actions_caches.length > 0) {
            		for (const cache of caches.data.actions_caches) {
            			if (cache.key == "cache-linux-build") {
            				console.log('Clearing ' + cache.key + '...')
            				await github.rest.actions.deleteActionsCacheById({
            					owner: context.repo.owner,
            					repo: context.repo.repo,
            					cache_id: cache.id,
            				})
            				console.log("Previous Cache Cleared!")
            			}
            		}
            	}
            } catch (error) {
            	console.log(error.message);
            }

      - name: Save Current Cache
        id: cache-build-linux-save
        uses: actions/cache/save@main[span_9](start_span)[span_9](end_span)
        with:
          path: |
            .haxelib/
            build/release/linux/haxe/
            build/release/linux/obj/
          key: cache-linux-build[span_10](start_span)[span_10](end_span)
      - name: Publish Artifact
        uses: actions/upload-artifact@main[span_11](start_span)[span_11](end_span)
        with:
          name: linuxBuild
          path: build/release/linux/bin

